---
name: Terraform

# Config-validity + plan-test gate. This is a MULTI-PROVIDER plan (F5 XC + Azure),
# but CI runs entirely WITHOUT Azure or XC credentials and does NOT perform a live
# plan/apply:
#
#   - The Azure providers (azurerm/azuread) require a service principal, which the
#     F5 corporate Entra tenant does not permit provisioning. A live plan/apply
#     against Azure is therefore a local/VPN operation (see CONTRIBUTING.md).
#   - The plan-level tests (tests/*.tftest.hcl) MOCK all three providers, so they
#     need no credentials of any kind. They are command = plan (no live API call).
on:
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'coverage/**'
      - 'docs/_imports'
      - 'docs/**/*.mdx'
      - 'docs/llms-links.json'
      - 'tests/test-terraform-imports.sh'
      - 'tests/test-terraform-version-policy.sh'
      - 'tests/test-deployment-provenance.sh'
      - 'tests/test_deployment_identity.py'
      - 'tests/test-aws-smsv2-uat-preflight.sh'
      - 'tests/test-aws-smsv2-lifecycle-plan.sh'
      - 'tests/test-generate-aws-smsv2-device-mapping.sh'
      - 'tests/test-aws-smsv2-owned-collision-preflight.sh'
      - 'tests/test-aws-deployment-generation.sh'
      - 'tests/test-aws-smsv2-orphan-recovery.sh'
      - 'tests/test-aws-root-owned-resource-tags.sh'
      - 'tests/test-aws-upgrade-showcase.sh'
      - 'tests/test-azure-ilb-no-route-server.sh'
      - 'tests/test-kvm-frr-lifecycle.sh'
      - 'tests/test-aws-state-backend.sh'
      - 'tests/test-configure-aws-state-backend.sh'
      - 'tests/test-terraform-with-aws-sso.sh'
      - 'scripts/configure-aws-state-backend.sh'
      - 'scripts/deployment-identity.py'
      - 'scripts/showcase-lifecycle.sh'
      - 'scripts/terraform-with-aws-sso.sh'
      - 'scripts/aws-smsv2-uat-preflight.sh'
      - 'scripts/aws-smsv2-lifecycle-plan.sh'
      - 'scripts/generate-aws-smsv2-device-mapping.py'
      - 'scripts/aws-smsv2-owned-collision-preflight.sh'
      - 'scripts/verify-aws-smsv2-orphan-recovery-plan.sh'
      - '.github/workflows/terraform.yml'
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'coverage/**'
      - 'docs/_imports'
      - 'docs/**/*.mdx'
      - 'docs/llms-links.json'
      - 'tests/test-terraform-imports.sh'
      - 'tests/test-terraform-version-policy.sh'
      - 'tests/test-deployment-provenance.sh'
      - 'tests/test_deployment_identity.py'
      - 'tests/test-aws-smsv2-uat-preflight.sh'
      - 'tests/test-aws-smsv2-lifecycle-plan.sh'
      - 'tests/test-generate-aws-smsv2-device-mapping.sh'
      - 'tests/test-aws-smsv2-owned-collision-preflight.sh'
      - 'tests/test-aws-deployment-generation.sh'
      - 'tests/test-aws-smsv2-orphan-recovery.sh'
      - 'tests/test-aws-root-owned-resource-tags.sh'
      - 'tests/test-aws-upgrade-showcase.sh'
      - 'tests/test-azure-ilb-no-route-server.sh'
      - 'tests/test-kvm-frr-lifecycle.sh'
      - 'tests/test-aws-state-backend.sh'
      - 'tests/test-configure-aws-state-backend.sh'
      - 'tests/test-terraform-with-aws-sso.sh'
      - 'scripts/configure-aws-state-backend.sh'
      - 'scripts/deployment-identity.py'
      - 'scripts/showcase-lifecycle.sh'
      - 'scripts/terraform-with-aws-sso.sh'
      - 'scripts/aws-smsv2-uat-preflight.sh'
      - 'scripts/aws-smsv2-lifecycle-plan.sh'
      - 'scripts/generate-aws-smsv2-device-mapping.py'
      - 'scripts/aws-smsv2-owned-collision-preflight.sh'
      - 'scripts/verify-aws-smsv2-orphan-recovery-plan.sh'
      - '.github/workflows/terraform.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: 'true'
  TF_VAR_source_repository: f5-sales-demo/multi-cloud-networking
  # The general Terraform suite asserts stable production names. Dedicated
  # deployment_provenance tests exercise preview refs explicitly.
  TF_VAR_source_ref: refs/heads/main
  TF_VAR_source_commit_sha: ${{ github.event.pull_request.head.sha || github.sha }}
  TF_VAR_deployment_owner_id: showcase-team
  TF_VAR_deployment_actor_id: github-actions

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Terraform documentation import manifest
        working-directory: .
        run: bash tests/test-terraform-imports.sh

      - name: Terraform provider version policy
        working-directory: .
        run: bash tests/test-terraform-version-policy.sh

      - name: Deployment identity unit tests
        working-directory: .
        run: python3 -m unittest tests/test_deployment_identity.py

      - name: Deployment provenance and isolation contract
        working-directory: .
        run: bash tests/test-deployment-provenance.sh

      - name: AWS SMSv2 UAT preflight unit tests
        working-directory: .
        run: bash tests/test-aws-smsv2-uat-preflight.sh

      - name: AWS owned collision preflight unit tests
        working-directory: .
        run: bash tests/test-aws-smsv2-owned-collision-preflight.sh

      - name: AWS immutable deployment generation contract
        working-directory: .
        run: bash tests/test-aws-deployment-generation.sh

      - name: AWS lost-state orphan recovery contract
        working-directory: .
        run: bash tests/test-aws-smsv2-orphan-recovery.sh

      - name: AWS root IAM ownership tag contract
        working-directory: .
        run: bash tests/test-aws-root-owned-resource-tags.sh

      - name: AWS three-site upgrade showcase contract
        working-directory: .
        run: bash tests/test-aws-upgrade-showcase.sh

      - name: Azure ILB and Route Server boundary
        working-directory: .
        run: bash tests/test-azure-ilb-no-route-server.sh

      - name: KVM FRR lifecycle contract
        working-directory: .
        run: bash tests/test-kvm-frr-lifecycle.sh

      - name: AWS state backend contract
        working-directory: .
        run: bash tests/test-aws-state-backend.sh

      - name: AWS state backend configuration lifecycle
        working-directory: .
        run: bash tests/test-configure-aws-state-backend.sh

      - name: AWS SMSv2 device-discovery lifecycle
        working-directory: .
        run: bash tests/test-aws-device-discovery.sh

      - name: AWS SMSv2 lifecycle saved-plan automation
        working-directory: .
        run: bash tests/test-aws-smsv2-lifecycle-plan.sh

      - name: AWS SMSv2 private mapping generator
        working-directory: .
        run: bash tests/test-generate-aws-smsv2-device-mapping.sh

      - name: Terraform AWS SSO credential isolation
        working-directory: .
        run: bash tests/test-terraform-with-aws-sso.sh

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.3

      - name: Terraform state backend bootstrap validation
        working-directory: terraform/bootstrap/state-backend
        run: |
          terraform init -backend=false -input=false
          terraform validate -no-color

      - name: Terraform orphan recovery root validation
        working-directory: terraform/recovery/aws-smsv2-orphans
        run: |
          terraform init -backend=false -input=false
          terraform validate -no-color

      - name: Terraform AWS SMSv2 frozen provider initialization
        working-directory: terraform
        run: |
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate -no-color

      - name: Init (no backend; CI has no cloud credentials)
        run: terraform init -input=false -backend=false

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Validate
        run: terraform validate -no-color

      - name: Plan-level module tests (all providers mocked)
        run: terraform test

  # SMSv2 coverage-probe validation gate. Credential-free: the numeric-leaf tests mock the
  # xcsh provider, so the provider's own schema validators fire at plan with no XC API call.
  # This job resolves f5-sales-demo/xcsh from the public registry, so it only turns green once
  # the exact clean-break provider version required by
  # `coverage/smsv2/versions.tf` (`= 10.1.0`) is published in the registry. Locally the same tests run
  # against the dev_overrides build via verify.sh.
  coverage-smsv2:
    name: coverage-smsv2
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coverage/smsv2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.3

      - name: Init (no backend; provider resolved from the registry)
        run: terraform init -input=false -backend=false

      - name: Numeric-validator gate (accept valid bounds + reject out-of-range)
        run: ./verify.sh
